name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 \
            libcairo2-dev pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # apt puts pycairo into the system interpreter, which setup-python's
          # tool-cache Python cannot see. The themes/ loader imports cairo at
          # module level, so without this the Modern/Digital dashboard themes
          # fail to load and are silently dropped from DASHBOARD_THEMES.
          python -m pip install pycairo
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q
