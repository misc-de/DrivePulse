[project]
name = "drivepulse"
version = "1.3.48"
description = "OBD-II dashboard — GTK4/libadwaita, GPS, navigation, dashcam"
requires-python = ">=3.11"
dependencies = [
    "obd",
    "pyserial",
    "requests",
    "cryptography",
]

[project.optional-dependencies]
tts = ["piper-tts"]

[project.scripts]
drivepulse = "drivepulse_app.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["drivepulse", "theme_defaults"]

[tool.setuptools.packages.find]
include = ["drivepulse_app*", "themes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
