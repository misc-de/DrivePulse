[project]
name = "drivepulse"
version = "0.4.85"
description = "OBD-II dashboard — GTK4/libadwaita, GPS, navigation, dashcam"
requires-python = ">=3.11"
dependencies = [
    "obd",
    "pyserial",
    "requests",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
tts = ["piper-tts"]

[project.scripts]
drivepulse = "drivepulse_app.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["drivepulse"]

[tool.setuptools.packages.find]
include = ["drivepulse_app*", "themes*"]

# map.html plus the vendored MapLibre runtime must ship with the wheel, or
# the WebKit map backend would silently fall back to the network on first
# launch — defeating the offline-startup guarantee.
[tool.setuptools.package-data]
"drivepulse_app.map" = ["map.html", "vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["__pycache__", "themes", "icons"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "I",   # isort
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line too long — handled by formatter, many existing long lines
    "PLR0913", # too many arguments — GTK callbacks
    "PLR0912", # too many branches — telemetry dispatchers
    "PLR0915", # too many statements — render loops
    "PLR2004", # magic value comparisons — UI pixel constants
    "PLR0911", # too many return statements
    "SIM108",  # ternary preference — not always clearer
    "PLC0415", # import-outside-top-level — deliberate lazy imports (Pillow, optional deps, circular avoidance)
    "E402",    # module-import-not-at-top-of-file — gi.require_version("Gtk", "4.0") must precede gi.repository imports
    "PLW0603", # global-statement — used intentionally for module-scoped singletons (logger, locks)
    "SIM105",  # suppressible-exception — explicit try/except is often clearer than contextlib.suppress
    "RUF001",  # ambiguous-unicode-character-string — German Umlaute and typographic chars in UI strings
    "RUF002",  # ambiguous-unicode-character-docstring — German Umlaute in German docstrings
    "RUF003",  # ambiguous-unicode-character-comment — German Umlaute in German comments
    "PLC0414", # useless-import-alias — `import X as X` is PEP 484 explicit re-export for tests that monkeypatch through the app module
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "B011"]

[tool.mypy]
python_version = "3.11"
files = ["drivepulse_app", "drivepulse.py"]
exclude = ["__pycache__", "themes/"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = false
disallow_untyped_defs = false

# PyGObject ships no type stubs — make gi.repository import as Any so the
# attribute-access noise from Gtk/Adw/Gdk calls disappears and real findings stay visible.
[[tool.mypy.overrides]]
module = ["gi", "gi.repository", "gi.repository.*"]
follow_imports = "skip"

# Mixin classes (DashboardLayoutMixin, CarsLayoutMixin, …) reference attributes
# (self.view_stack, self.dashboard_page, …) that are set by the concrete window
# class composing them. Mypy can't see across the composition without Protocols,
# so attr-defined errors on these modules are structural false positives.
[[tool.mypy.overrides]]
module = [
    "drivepulse_app.cars.actions",
    "drivepulse_app.cars.detail_render",
    "drivepulse_app.cars.layout",
    "drivepulse_app.cars.photos",
    "drivepulse_app.cars.scans",
    "drivepulse_app.cars.stopwatch_runs",
    "drivepulse_app.cars.trips",
    "drivepulse_app.dashboard.layout",
    "drivepulse_app.dashboard.piper_overlay",
    "drivepulse_app.dashboard.settings",
    "drivepulse_app.dashboard.telemetry",
    "drivepulse_app.map.layout",
    "drivepulse_app.map.layout_search",
    "drivepulse_app.map.layout_steps",
    "drivepulse_app.map.layout_tour_actions",
    "drivepulse_app.map.replay",
    "drivepulse_app.map.shumate",
    "drivepulse_app.map.tour",
    "drivepulse_app.map.traffic",
    "drivepulse_app.map.webkit",
    "drivepulse_app.settings.bluetooth",
    "drivepulse_app.settings.dashcam",
    "drivepulse_app.stopwatch.processing",
    "drivepulse_app.stopwatch.replay",
]
disable_error_code = ["attr-defined", "has-type", "var-annotated"]
