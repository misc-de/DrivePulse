# Community-documented coding/adaptation functions for the Audi A6 4G (C7,
# model years 2011–2018) and its close siblings (A7 4G, A8 4H share many of
# these). Sourced from public VCDS/OBDeleven community references
# (Ross-Tech wiki, motor-talk / blafusel coding threads).
#
# READ THIS BEFORE TRUSTING A LOCATION:
#   These VAG modules use long coding (DID 0x0600, extended session) plus
#   per-channel adaptation values. The *function* and the *module* below are
#   reliable, but the exact byte/bit or adaptation channel drifts between
#   control-module software versions. Entries with `verify = true` MUST be
#   confirmed on the specific car before they mean anything — use the read-only
#   snapshot diff (drivepulse_app/obd/coding_diff.py): toggle the function in
#   the car, diff a fresh read against the baseline, and the changed byte/bit
#   IS the location for that build.
#
# `module` matches the keys in drivepulse_app/obd/uds.py VAG_MODULES.
# `type`   = long_coding | adaptation | menu
# This file is data only — read-only reference, never written to the vehicle.

source = "VAG community coding references (Audi A6 4G / C7)"

# ── Kombiinstrument · module 17 (tx 714 / rx 77E) ────────────────────────────

[[coding]]
key = "needle_sweep"
module = "instruments"
category = "display"
name = "Zeigersweep beim Start (Needle sweep / Staging)"
type = "adaptation"
location = "Adaptionskanal \"Staging\" / \"Needle sweep\""
note = "Gauge needles sweep to full deflection on ignition-on."
verify = true

[[coding]]
key = "digital_speed"
module = "instruments"
category = "display"
name = "Digitale Geschwindigkeitsanzeige im FIS/DIS"
type = "long_coding"
location = "Long coding, byte/bit per SW version"
note = "Shows numeric speed in the driver information display."
verify = true

[[coding]]
