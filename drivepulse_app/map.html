<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right { display: none; }
    .car-icon {
      width: 44px; height: 44px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55));
      pointer-events: none;
    }
    .nav-arrow {
      width: 44px; height: 44px;
      transform-origin: 50% 50%;
      transition: transform 120ms linear;
      will-change: transform;
    }
    #error {
      display: none; position: absolute; inset: 0;
      background: #1a1a2e; color: rgba(255,255,255,0.7);
      font-family: sans-serif; font-size: 14px;
      flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    }
    #error.visible { display: flex; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="error">
  <span style="font-size:2.5em">⚠</span>
  <span>Map konnte nicht geladen werden.</span>
  <span style="font-size:0.85em;opacity:0.6">Internetverbindung prüfen.</span>
</div>
<script>
  window.addEventListener('error', (e) => {
    if (e.target && e.target.tagName === 'SCRIPT')
      document.getElementById('error').classList.add('visible');
  }, true);
</script>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
'use strict';

// ── Map styles ────────────────────────────────────────────────────────────────
function rasterStyle(tiles, attribution, maxzoom) {
  return {
    version: 8,
    sources: { base: { type: 'raster', tiles, tileSize: 256, attribution, maxzoom } },
    layers:  [{ id: 'base', type: 'raster', source: 'base' }],
  };
}

const STYLES = {
  street: 'https://tiles.openfreemap.org/styles/liberty',
  dark: rasterStyle(
    ['https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png'],
    '© CartoDB', 19
  ),
  satellite: rasterStyle(
    ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
    '© Esri', 18
  ),
};

// ── Persistent state (survives style changes) ─────────────────────────────────
let map = null;
let carMarker = null;
let carEl = null;
let carArrowEl = null;
let followMode = true;
let initialized = false;

let _routeCoords    = [];
let _guideCoords    = [];
let _wpStart        = null;   // [lat, lon]
let _wpEnd          = null;
let _trafficItems   = [];
let _trafficVisible = false;
let _gpsLon = null, _gpsLat = null;
let _poiVisible     = true;
let _tourActive     = false;
let _smoothedBearing = null;  // EMA-smoothed compass bearing to dampen heading jitter

const DEFAULT_CENTER = { lat: 48.137, lon: 11.576 };

// ── Python bridge ─────────────────────────────────────────────────────────────
function postToPython(data) {
  try { window.webkit.messageHandlers.drivepulse.postMessage(data); } catch (_) {}
}

// ── GeoJSON helpers ───────────────────────────────────────────────────────────
function lineGJ(coords) {
  return {
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: coords.length >= 2 ? coords : [[0,0],[0.001,0.001]] }
  };
}
function fcGJ(features) { return { type: 'FeatureCollection', features }; }
function wpFeat(latlon, role) {
  if (!latlon) return null;
  return {
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [latlon[1], latlon[0]] },
    properties: { role }
  };
}

// ── Custom data layers (re-created after every style.load) ────────────────────
function addDataLayers() {
  // Guide-to-start (dashed gray, shown below main route)
  if (!map.getSource('guide')) {
    map.addSource('guide', { type: 'geojson', data: lineGJ(_guideCoords) });
    map.addLayer({ id: 'guide-line', type: 'line', source: 'guide',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#F5A623', 'line-width': 4, 'line-opacity': 0.85,
               'line-dasharray': [2, 2] } });
  }

  // Route
  if (!map.getSource('route')) {
    map.addSource('route', { type: 'geojson', data: lineGJ(_routeCoords) });
    map.addLayer({ id: 'route-case', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#1a6fa8', 'line-width': 10, 'line-opacity': 0.5 } });
    map.addLayer({ id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#3daee9', 'line-width': 5, 'line-opacity': 0.9 } });
  }

  // Waypoints
  const wpFeats = [wpFeat(_wpStart, 'start'), wpFeat(_wpEnd, 'end')].filter(Boolean);
  if (!map.getSource('waypoints')) {
    map.addSource('waypoints', { type: 'geojson', data: fcGJ(wpFeats) });
    map.addLayer({ id: 'waypoints', type: 'circle', source: 'waypoints',
      paint: {
        'circle-radius': 9,
        'circle-color': ['match', ['get', 'role'], 'start', '#2ec06e', 'via', '#F29A0A', '#e53030'],
        'circle-stroke-color': '#fff', 'circle-stroke-width': 2,
      }
    });
  }

  // Traffic — filtered to route bounding box (+ ~5 km pad) for performance
  const trafficFeats = _trafficNearRoute();
  const vis = _trafficVisible ? 'visible' : 'none';
  if (!map.getSource('traffic')) {
    map.addSource('traffic', { type: 'geojson', data: fcGJ(trafficFeats) });
    map.addLayer({ id: 'traffic-rw', type: 'circle', source: 'traffic',
      filter: ['==', ['get', 'kind'], 'roadworks'],
      paint: { 'circle-radius': 7, 'circle-color': '#F5990A',
               'circle-stroke-color': '#B36000', 'circle-stroke-width': 2 },
      layout: { visibility: vis } });
    map.addLayer({ id: 'traffic-inc', type: 'circle', source: 'traffic',
      filter: ['==', ['get', 'kind'], 'incidents'],
      paint: { 'circle-radius': 7, 'circle-color': '#E53030',
               'circle-stroke-color': '#9A1A1A', 'circle-stroke-width': 2 },
      layout: { visibility: vis } });
  }

  setBasePoiVisibility(_poiVisible);
}

// ── Init (triggered by first GPS fix or explicit call) ────────────────────────
function initMap(lat, lon) {
  if (initialized) return;
  initialized = true;

  map = new maplibregl.Map({
    container: 'map',
    style: STYLES.street,
    center: [lon, lat],
    zoom: 15,
    pitch: 0,
    bearing: 0,
    maxPitch: 85,            // allow strong 3D tilt for active tours
    antialias: false,        // faster rendering on mobile/embedded GPU
    fadeDuration: 0,         // tiles appear instantly, no fade-in overhead
    renderWorldCopies: false, // no duplicate world tiles
  });

  // Location arrow (classic navigation marker)
  carEl = document.createElement('div');
  carEl.className = 'car-icon';
  carEl.innerHTML = `<div class="nav-arrow">
    <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="22" cy="22" r="18" fill="rgba(41,128,185,0.18)"/>
      <path d="M22 3 L34 34 L22 28 L10 34 Z"
            fill="#1E88E5" stroke="#FFFFFF" stroke-width="3"
            stroke-linejoin="round"/>
      <path d="M22 8 L29 27 L22 23 L15 27 Z"
            fill="#42A5F5"/>
    </svg>
  </div>`;
  carArrowEl = carEl.querySelector('.nav-arrow');

  carMarker = new maplibregl.Marker({ element: carEl, anchor: 'center' })
    .setLngLat([lon, lat])
    .addTo(map);

  map.on('style.load', addDataLayers);

  map.on('dragstart', () => {
    if (followMode) {
      followMode = false;
      postToPython({ action: 'follow_off' });
    }
  });

}

// ── Base-map POI visibility ──────────────────────────────────────────────────
function isBasePoiLayer(layer) {
  if (!layer || layer.type !== 'symbol') return false;
  const id = String(layer.id || '').toLowerCase();
  const sourceLayer = String(layer['source-layer'] || '').toLowerCase();
  const layout = layer.layout || {};
  const hasIcon = Object.prototype.hasOwnProperty.call(layout, 'icon-image');
  if (id.includes('poi') || sourceLayer.includes('poi')) return true;
  if (!hasIcon) return false;
  if (/(road|highway|shield|route|place|boundary|water|country|state|city|town|village|settlement)/.test(id)) {
    return false;
  }
  return /(amenity|shop|tourism|leisure|park|food|restaurant|fuel|parking|medical|hospital|pharmacy|station|airport)/.test(id + ' ' + sourceLayer);
}

function setBasePoiVisibility(visible) {
  if (!map || !map.isStyleLoaded()) return;
  const style = map.getStyle();
  const visibility = visible ? 'visible' : 'none';
  (style.layers || []).forEach(layer => {
    if (isBasePoiLayer(layer) && map.getLayer(layer.id)) {
      map.setLayoutProperty(layer.id, 'visibility', visibility);
    }
  });
}

// ── Public API (called from Python) ──────────────────────────────────────────
function mapSetCar(lat, lon, heading) {
  if (!initialized) initMap(lat, lon);
  if (!map) return;
  _gpsLat = lat; _gpsLon = lon;
  const targetBearing = Number(heading || 0);
  // EMA-smooth bearing with shortest-arc wrap so sharp turns ease in instead
  // of snapping. alpha tuned for ~4 Hz GPS — settles in ~500 ms.
  if (_smoothedBearing === null) {
    _smoothedBearing = targetBearing;
  } else {
    const delta = ((targetBearing - _smoothedBearing + 540) % 360) - 180;
    _smoothedBearing = (_smoothedBearing + delta * 0.30 + 360) % 360;
  }
  const hdg = _smoothedBearing;
  if (carMarker) carMarker.setLngLat([lon, lat]);
  // Arrow: relative to map bearing. In follow-mode the map rotates with heading,
  // so the arrow always points straight up (0°). Otherwise show absolute heading.
  if (carArrowEl) carArrowEl.style.transform = `rotate(${followMode ? 0 : hdg}deg)`;
  if (followMode) {
    // Tour mode: shift car into lower third so more road ahead is visible.
    const pad = _tourActive
      ? { top: Math.round(window.innerHeight * 0.38), bottom: 0, left: 0, right: 0 }
      : { top: 0, bottom: 0, left: 0, right: 0 };
    // Duration is slightly longer than the GPS push interval (250 ms) so each
    // animation blends into the next, avoiding the stutter-and-jump look.
    const opts = {
      center: [lon, lat], bearing: hdg, duration: 280, padding: pad,
      easing: t => t,  // linear, so consecutive eases concatenate smoothly
    };
    // Keep the strong tilt while a tour is active; flatten view otherwise.
    if (!_tourActive) opts.pitch = 0;
    map.easeTo(opts);
  }
}

function mapSetFollow(active) {
  followMode = active;
}

function mapSetTourActive(active) {
  _tourActive = active;
  if (!active && map) {
    _smoothedBearing = null;
    map.easeTo({ bearing: 0, pitch: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 }, duration: 400 });
  }
}

function mapStartTour(lat, lon) {
  if (!initialized) initMap(lat, lon);
  if (!map) return;
  _tourActive = true;
  _smoothedBearing = null;
  const z = typeof map.getMaxZoom === 'function' ? map.getMaxZoom() : 22;
  const p = typeof map.getMaxPitch === 'function' ? map.getMaxPitch() : 60;
  map.flyTo({ center: [lon, lat], zoom: z, pitch: p, duration: 900 });
}

function mapSetRoute(coords) {
  _routeCoords = coords;
  if (map && map.getSource('route'))
    map.getSource('route').setData(lineGJ(coords));
  // Refresh traffic to show only items near the new route
  if (map && map.getSource('traffic'))
    map.getSource('traffic').setData(fcGJ(_trafficNearRoute()));
}

function mapSetWaypoints(points) {
  // points = [[lat,lon], ...] — first=start, last=end, middle=via
  _wpStart = points.length > 0 ? points[0] : null;
  _wpEnd   = points.length > 1 ? points[points.length - 1] : null;
  if (map && map.getSource('waypoints')) {
    const feats = points.map((pt, i) => {
      const role = i === 0 ? 'start' : (i === points.length - 1 ? 'end' : 'via');
      return wpFeat(pt, role);
    }).filter(Boolean);
    map.getSource('waypoints').setData(fcGJ(feats));
  }
}

function mapClearRoute() {
  _routeCoords = []; _wpStart = null; _wpEnd = null; _tourActive = false;
  mapClearGuideToStart();
  if (map) {
    if (map.getSource('route'))     map.getSource('route').setData(lineGJ([]));
    if (map.getSource('waypoints')) map.getSource('waypoints').setData(fcGJ([]));
    if (map.getSource('traffic'))   map.getSource('traffic').setData(fcGJ([]));
    map.easeTo({ bearing: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 }, pitch: 0, duration: 600 });
  }
}

function mapSetGuideToStart(coords) {
  _guideCoords = coords;
  if (map && map.getSource('guide'))
    map.getSource('guide').setData(lineGJ(coords));
}

function mapClearGuideToStart() {
  _guideCoords = [];
  if (map && map.getSource('guide'))
    map.getSource('guide').setData(lineGJ([]));
}

function mapGoTo(lat, lon, zoom) {
  if (!initialized) initMap(lat, lon);
  if (!map) return;
  map.flyTo({ center: [lon, lat], zoom: zoom, pitch: 0, duration: 900 });
}

function mapSetRouteVisible(visible) {
  if (!map) return;
  const v = visible ? 'visible' : 'none';
  ['route-case', 'route-line', 'waypoints'].forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v);
  });
}

function mapFitBounds(minLat, minLon, maxLat, maxLon) {
  if (!initialized) return;
  if (!map) return;
  map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 48, pitch: 0, duration: 900 });
}

function mapSetStyle(key) {
  if (!map) return;
  const style = STYLES[key] || STYLES.street;
  map.setStyle(style);
}

function _trafficNearRoute() {
  if (_routeCoords.length === 0) return [];
  let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
  for (const [lon, lat] of _routeCoords) {
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
    if (lon < minLon) minLon = lon;
    if (lon > maxLon) maxLon = lon;
  }
  const pad = 0.05; // ~5 km bounding-box padding
  return _trafficItems
    .filter(i => i.lat >= minLat - pad && i.lat <= maxLat + pad &&
                 i.lon >= minLon - pad && i.lon <= maxLon + pad)
    .map(i => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [i.lon, i.lat] },
      properties: { kind: i.kind, title: i.title }
    }));
}

function mapSetTraffic(items) {
  _trafficItems = items;
  if (map && map.getSource('traffic'))
    map.getSource('traffic').setData(fcGJ(_trafficNearRoute()));
}

function mapSetTrafficVisible(visible) {
  _trafficVisible = visible;
  if (!map) return;
  ['traffic-rw', 'traffic-inc'].forEach(id => {
    if (map.getLayer(id))
      map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
  });
}

function mapSetPoiVisible(visible) {
  _poiVisible = visible;
  setBasePoiVisibility(visible);
}

function mapResize() {
  if (map) map.resize();
}

window.addEventListener('DOMContentLoaded', () => {
  const mapEl = document.getElementById('map');

  function tryInit() {
    if (!initialized && mapEl.clientWidth > 0 && mapEl.clientHeight > 0) {
      initMap(DEFAULT_CENTER.lat, DEFAULT_CENTER.lon);
    }
  }

  // Observe container size — init as soon as we have real dimensions,
  // then keep resizing on every layout change (tab switch, window resize).
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => {
      if (!initialized) {
        tryInit();
      } else if (map) {
        map.resize();
      }
    }).observe(mapEl);
  }

  // Also try immediately (works when map tab is the default/active tab).
  tryInit();

  // Last-resort fallback: poll for a real size during the first 2 s.
  let _initTries = 0;
  const _initTimer = setInterval(() => {
    if (initialized || ++_initTries > 20) { clearInterval(_initTimer); return; }
    tryInit();
  }, 100);
});
</script>
</body>
</html>
