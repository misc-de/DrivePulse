<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right { display: none; }
    .car-icon {
      width: 44px; height: 44px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55));
      pointer-events: none;
    }
    .nav-arrow {
      width: 44px; height: 44px;
      transform-origin: 50% 50%;
      transition: transform 120ms linear;
      will-change: transform;
    }
    #error {
      display: none; position: absolute; inset: 0;
      background: #1a1a2e; color: rgba(255,255,255,0.7);
      font-family: sans-serif; font-size: 14px;
      flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    }
    #error.visible { display: flex; }
    .dp-traffic-popup .maplibregl-popup-content {
      background: rgba(20, 24, 32, 0.94);
      color: #fff;
      border-radius: 10px;
      padding: 10px 28px 10px 12px;  /* room on right for the × button */
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.35;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      width: 260px;
      max-height: 280px;
      overflow-y: auto;
    }
    .dp-traffic-popup .maplibregl-popup-tip { border-top-color: rgba(20, 24, 32, 0.94); }
    .dp-traffic-popup .maplibregl-popup-close-button {
      color: #fff; font-size: 18px; padding: 2px 6px;
    }
    .dp-traffic-popup h3 { font-size: 13px; margin-bottom: 3px; }
    .dp-traffic-popup .sub { opacity: 0.8; margin-bottom: 4px; }
    .dp-traffic-popup .blocked { color: #ff7676; font-weight: 700; margin-bottom: 3px; }
    .dp-traffic-popup .delay { margin-bottom: 3px; }
    .dp-traffic-popup .since { opacity: 0.7; font-size: 11px; margin-bottom: 4px; }
    .dp-traffic-popup .desc {
      border-top: 1px solid rgba(255,255,255,0.18);
      padding-top: 4px; white-space: pre-line; opacity: 0.92;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="error">
  <span style="font-size:2.5em">⚠</span>
  <span>Map konnte nicht geladen werden.</span>
  <span style="font-size:0.85em;opacity:0.6">Internetverbindung prüfen.</span>
</div>
<script>
  window.addEventListener('error', (e) => {
    if (e.target && e.target.tagName === 'SCRIPT')
      document.getElementById('error').classList.add('visible');
  }, true);
</script>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
'use strict';

// ── Map styles ────────────────────────────────────────────────────────────────
function rasterStyle(tiles, attribution, maxzoom) {
  return {
    version: 8,
    sources: { base: { type: 'raster', tiles, tileSize: 256, attribution, maxzoom } },
    layers:  [{ id: 'base', type: 'raster', source: 'base' }],
  };
}

const STYLES = {
  street: 'https://tiles.openfreemap.org/styles/liberty',
  dark: rasterStyle(
    ['https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png'],
    '© CartoDB', 19
  ),
  satellite: rasterStyle(
    ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
    '© Esri', 18
  ),
};

// ── Persistent state (survives style changes) ─────────────────────────────────
let map = null;
let carMarker = null;
let carEl = null;
let carArrowEl = null;
let followMode = true;
let initialized = false;

let _routeCoords    = [];
let _guideCoords    = [];
let _wpStart        = null;   // [lat, lon]
let _wpEnd          = null;
let _trafficItems   = [];
let _trafficVisible = false;
let _gpsLon = null, _gpsLat = null;
let _poiVisible     = false;  // POIs are opt-in per session — keep them hidden until Python toggles them on
let _tourActive     = false;
let _smoothedBearing = null;  // EMA-smoothed compass bearing used to *drive the map's* bearing
let _rawHeading      = null;  // most recent GPS heading — used by the arrow so it responds instantly
let _tourFlying     = false;  // suppresses GPS-driven easeTo while mapStartTour's flyTo is animating
let _view3D         = true;   // false = top-down flat map; true = tilted 3D view
let _followingGps   = false;  // while true, the marker tracks map.getCenter() every frame

const DEFAULT_CENTER = { lat: 48.137, lon: 11.576 };

// ── Python bridge ─────────────────────────────────────────────────────────────
function postToPython(data) {
  try { window.webkit.messageHandlers.drivepulse.postMessage(data); } catch (_) {}
}

// ── GeoJSON helpers ───────────────────────────────────────────────────────────
function lineGJ(coords) {
  return {
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: coords.length >= 2 ? coords : [[0,0],[0.001,0.001]] }
  };
}
function fcGJ(features) { return { type: 'FeatureCollection', features }; }
function wpFeat(latlon, role) {
  if (!latlon) return null;
  return {
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [latlon[1], latlon[0]] },
    properties: { role }
  };
}

// ── Custom data layers (re-created after every style.load) ────────────────────
function addDataLayers() {
  // Guide-to-start (dashed gray, shown below main route)
  if (!map.getSource('guide')) {
    map.addSource('guide', { type: 'geojson', data: lineGJ(_guideCoords) });
    map.addLayer({ id: 'guide-line', type: 'line', source: 'guide',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#F5A623', 'line-width': 4, 'line-opacity': 0.85,
               'line-dasharray': [2, 2] } });
  }

  // Route
  if (!map.getSource('route')) {
    map.addSource('route', { type: 'geojson', data: lineGJ(_routeCoords) });
    map.addLayer({ id: 'route-case', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#1a6fa8', 'line-width': 10, 'line-opacity': 0.5 } });
    map.addLayer({ id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#3daee9', 'line-width': 5, 'line-opacity': 0.9 } });
  }

  // Waypoints
  const wpFeats = [wpFeat(_wpStart, 'start'), wpFeat(_wpEnd, 'end')].filter(Boolean);
  if (!map.getSource('waypoints')) {
    map.addSource('waypoints', { type: 'geojson', data: fcGJ(wpFeats) });
    map.addLayer({ id: 'waypoints', type: 'circle', source: 'waypoints',
      paint: {
        'circle-radius': 9,
        'circle-color': ['match', ['get', 'role'], 'start', '#2ec06e', 'via', '#F29A0A', '#e53030'],
        'circle-stroke-color': '#fff', 'circle-stroke-width': 2,
      }
    });
  }

  // Traffic — filtered to route bounding box (+ ~5 km pad) for performance
  const trafficFeats = _trafficNearRoute();
  const vis = _trafficVisible ? 'visible' : 'none';
  if (!map.getSource('traffic')) {
    map.addSource('traffic', { type: 'geojson', data: fcGJ(trafficFeats) });
    map.addLayer({ id: 'traffic-rw', type: 'circle', source: 'traffic',
      filter: ['==', ['get', 'kind'], 'roadworks'],
      paint: { 'circle-radius': 7, 'circle-color': '#F5990A',
               'circle-stroke-color': '#B36000', 'circle-stroke-width': 2 },
      layout: { visibility: vis } });
    map.addLayer({ id: 'traffic-inc', type: 'circle', source: 'traffic',
      filter: ['==', ['get', 'kind'], 'incidents'],
      paint: { 'circle-radius': 7, 'circle-color': '#E53030',
               'circle-stroke-color': '#9A1A1A', 'circle-stroke-width': 2 },
      layout: { visibility: vis } });
    _attachTrafficClick('traffic-rw');
    _attachTrafficClick('traffic-inc');
  }

  setBasePoiVisibility(_poiVisible);
}

// ── Init (triggered by first GPS fix or explicit call) ────────────────────────
function initMap(lat, lon) {
  if (initialized) return;
  initialized = true;

  map = new maplibregl.Map({
    container: 'map',
    style: STYLES.street,
    center: [lon, lat],
    zoom: 15,
    pitch: 0,
    bearing: 0,
    maxPitch: 85,            // allow strong 3D tilt for active tours
    antialias: false,        // faster rendering on mobile/embedded GPU
    fadeDuration: 0,         // tiles appear instantly, no fade-in overhead
    renderWorldCopies: false, // no duplicate world tiles
    attributionControl: { compact: true },  // bottom-right OSM credit
  });

  // OSM credit (compact ⓘ button) is already added via attributionControl;
  // a scale bar in the lower-left helps the driver gauge distance.
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-left');

  // Location arrow (classic navigation marker)
  carEl = document.createElement('div');
  carEl.className = 'car-icon';
  carEl.innerHTML = `<div class="nav-arrow">
    <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="22" cy="22" r="18" fill="rgba(41,128,185,0.18)"/>
      <path d="M22 3 L34 34 L22 28 L10 34 Z"
            fill="#1E88E5" stroke="#FFFFFF" stroke-width="3"
            stroke-linejoin="round"/>
      <path d="M22 8 L29 27 L22 23 L15 27 Z"
            fill="#42A5F5"/>
    </svg>
  </div>`;
  carArrowEl = carEl.querySelector('.nav-arrow');

  carMarker = new maplibregl.Marker({ element: carEl, anchor: 'center' })
    .setLngLat([lon, lat])
    .addTo(map);

  map.on('style.load', addDataLayers);

  // Keep marker glued to the camera center while we're following GPS, and
  // always recompute the arrow rotation relative to the current map bearing.
  map.on('move', () => {
    if (_followingGps && carMarker) {
      const c = map.getCenter();
      carMarker.setLngLat([c.lng, c.lat]);
    }
    _updateArrowRotation();
  });
  map.on('rotate', _updateArrowRotation);

  // Push camera state to Python whenever the map settles after a movement
  // (zoom, pitch, rotate, pan). This drives the mock-mode debug overlay so
  // values appear even without GPS / tour activity.
  const _pushCamState = () => {
    try {
      postToPython({
        action: 'map_state',
        zoom: map.getZoom(),
        pitch: map.getPitch(),
        bearing: map.getBearing(),
      });
    } catch (_) {}
  };
  map.on('idle', _pushCamState);
  map.on('zoomend', _pushCamState);
  map.on('pitchend', _pushCamState);
  map.on('rotateend', _pushCamState);
  map.on('moveend', _pushCamState);
  // Initial push once the map has its first frame, so values show up
  // before the user does anything.
  map.once('load', _pushCamState);
  // Safety net — fire on a 1 s interval too, in case the *end events
  // don't trigger (e.g. continuous animation, tour fly-in).
  setInterval(_pushCamState, 1000);

  map.on('dragstart', () => {
    // While a tour is active the map must stay oriented to the driving
    // direction — let the user pan but keep follow logically on so the
    // bearing keeps tracking heading.
    if (followMode && !_tourActive) {
      followMode = false;
      postToPython({ action: 'follow_off' });
    }
  });

}

// ── Base-map POI visibility ──────────────────────────────────────────────────
function isBasePoiLayer(layer) {
  if (!layer || layer.type !== 'symbol') return false;
  const id = String(layer.id || '').toLowerCase();
  const sourceLayer = String(layer['source-layer'] || '').toLowerCase();
  const layout = layer.layout || {};
  const hasIcon = Object.prototype.hasOwnProperty.call(layout, 'icon-image');
  if (id.includes('poi') || sourceLayer.includes('poi')) return true;
  if (!hasIcon) return false;
  if (/(road|highway|shield|route|place|boundary|water|country|state|city|town|village|settlement)/.test(id)) {
    return false;
  }
  return /(amenity|shop|tourism|leisure|park|food|restaurant|fuel|parking|medical|hospital|pharmacy|station|airport)/.test(id + ' ' + sourceLayer);
}

function setBasePoiVisibility(visible) {
  // NOTE: do not short-circuit on isStyleLoaded() — that flag is still false
  // while the style.load event is firing, which is exactly when we want to
  // apply the initial POI=hidden state.  getStyle() already returns the parsed
  // layer list at this point, so iterating is safe.
  if (!map) return;
  let style;
  try { style = map.getStyle(); } catch (_) { return; }
  if (!style) return;
  const visibility = visible ? 'visible' : 'none';
  (style.layers || []).forEach(layer => {
    if (isBasePoiLayer(layer) && map.getLayer(layer.id)) {
      try {
        map.setLayoutProperty(layer.id, 'visibility', visibility);
      } catch (_) { /* layer may have been removed between getStyle() and now */ }
    }
  });
}

// ── Public API (called from Python) ──────────────────────────────────────────
function _updateArrowRotation() {
  if (!carArrowEl) return;
  // Use the *raw* GPS heading, not the smoothed one.  The map's bearing eases
  // toward _smoothedBearing over 280 ms, so when the car enters a curve the
  // raw heading jumps ahead while map bearing is still catching up — that
  // difference is what makes the arrow physically "lean into" the turn,
  // pointing along the road instead of just sitting glued to screen-up.
  const hdg = _rawHeading === null ? 0 : _rawHeading;
  const mapBearing = map ? map.getBearing() : 0;
  const angle = ((hdg - mapBearing) % 360 + 360) % 360;
  carArrowEl.style.transform = `rotate(${angle}deg)`;
}

function mapSetCar(lat, lon, heading) {
  if (!initialized) initMap(lat, lon);
  if (!map) return;
  _gpsLat = lat; _gpsLon = lon;
  const targetBearing = Number(heading || 0);
  _rawHeading = targetBearing;  // arrow uses this — snaps to actual heading
  // EMA-smooth the bearing the *map* will rotate to.  The arrow doesn't go
  // through this filter, so the arrow leads into a turn while the map catches
  // up — much closer to how real navigation arrows behave.
  if (_smoothedBearing === null) {
    _smoothedBearing = targetBearing;
  } else {
    const delta = ((targetBearing - _smoothedBearing + 540) % 360) - 180;
    _smoothedBearing = (_smoothedBearing + delta * 0.30 + 360) % 360;
  }
  const hdg = _smoothedBearing;
  // When the camera follows the GPS, the marker is *not* set directly here —
  // instead the map.on('move', ...) listener (registered in initMap) keeps the
  // marker pinned to the camera center every animation frame, so the marker
  // and the map glide together with no "map jumps forward, arrow hops behind".
  if (!followMode) {
    if (carMarker) carMarker.setLngLat([lon, lat]);
  }
  _followingGps = followMode;
  _updateArrowRotation();
  if (!_tourFlying) {
    // Duration is slightly longer than the GPS push interval (250 ms) so each
    // animation blends into the next, avoiding the stutter-and-jump look.
    const opts = {
      bearing: hdg, duration: 280,
      easing: t => t,  // linear, so consecutive eases concatenate smoothly
    };
    if (followMode) {
      // Tour mode: shift car into lower third so more road ahead is visible.
      const pad = _tourActive
        ? { top: Math.round(window.innerHeight * 0.38), bottom: 0, left: 0, right: 0 }
        : { top: 0, bottom: 0, left: 0, right: 0 };
      opts.center = [lon, lat];
      opts.padding = pad;
      // Flatten only when no tour is active AND user has not selected 3D.
      if (!_tourActive && !_view3D) opts.pitch = 0;
      map.easeTo(opts);
    } else {
      // Follow was disabled (user panned) — but the map should still stay
      // aligned to the direction of travel.  Rotate around the current view
      // centre without recentring, so the user's pan is preserved.
      map.easeTo(opts);
    }
  }
  // Push current camera state to Python (mock-mode debug overlay reads this).
  try {
    postToPython({
      action: 'map_state',
      zoom: map.getZoom(),
      pitch: map.getPitch(),
      bearing: map.getBearing(),
    });
  } catch (_) {}
}

function mapSetFollow(active) {
  followMode = active;
}

function mapSetTourActive(active) {
  // Just flip the flag — DO NOT mutate the camera here.  Pausing a tour must
  // leave the view exactly as the driver had it (zoomed, tilted, rotated).
  // Aborting/clearing the route is what calls mapResetView() explicitly.
  _tourActive = active;
  if (!active) {
    _smoothedBearing = null;
    _rawHeading = null;
    _tourFlying = false;
  }
}

function mapResetView() {
  if (!map) return;
  _smoothedBearing = null;
  _rawHeading = null;
  _tourFlying = false;
  map.easeTo({
    bearing: 0, pitch: 0,
    padding: { top: 0, bottom: 0, left: 0, right: 0 },
    duration: 400,
  });
}

// Tour start camera — tuned for legibility:
//   zoom 18  — close enough to read street names, far enough to see ahead
//   pitch 49 — strong sense of 3D without losing distance perception
//   bearing 0 — start facing north; rotates to heading as soon as GPS arrives
const TOUR_ZOOM    = 18;
const TOUR_PITCH   = 49;
const TOUR_BEARING = 0;

function mapSet3DView(enabled) {
  _view3D = !!enabled;
  if (!map) return;
  const targetPitch = _view3D
    ? Math.min(TOUR_PITCH, typeof map.getMaxPitch === 'function' ? map.getMaxPitch() : 60)
    : 0;
  map.easeTo({ pitch: targetPitch, duration: 400 });
}

function mapStartTour(lat, lon) {
  if (!initialized) initMap(lat, lon);
  if (!map) return;
  _tourActive = true;
  _smoothedBearing = null;
  _rawHeading = null;
  const maxZ = typeof map.getMaxZoom === 'function' ? map.getMaxZoom() : 22;
  const maxP = typeof map.getMaxPitch === 'function' ? map.getMaxPitch() : 60;
  const z = Math.min(TOUR_ZOOM, maxZ);
  const p = _view3D ? Math.min(TOUR_PITCH, maxP) : 0;
  // Fly to the tour camera, then hold it still for a few seconds so the user
  // can orient (the "Navikarten-Aufbau" period).  GPS-driven easeTo is
  // suppressed for the entire settle window — otherwise the first GPS tick
  // would cancel the flyTo and yank the camera into follow mode.
  _tourFlying = true;
  map.flyTo({
    center: [lon, lat],
    zoom: z, pitch: p, bearing: TOUR_BEARING,
    duration: 900,
  });
  setTimeout(() => { _tourFlying = false; }, 3000);
}

function mapZoomIn() {
  if (!map) return;
  map.easeTo({ zoom: map.getZoom() + 1, duration: 200 });
}

function mapZoomOut() {
  if (!map) return;
  map.easeTo({ zoom: map.getZoom() - 1, duration: 200 });
}

function mapSetRoute(coords) {
  _routeCoords = coords;
  if (map && map.getSource('route'))
    map.getSource('route').setData(lineGJ(coords));
  // Refresh traffic to show only items near the new route
  if (map && map.getSource('traffic'))
    map.getSource('traffic').setData(fcGJ(_trafficNearRoute()));
}

function mapSetWaypoints(points) {
  // points = [[lat,lon], ...] — first=start, last=end, middle=via
  _wpStart = points.length > 0 ? points[0] : null;
  _wpEnd   = points.length > 1 ? points[points.length - 1] : null;
  if (map && map.getSource('waypoints')) {
    const feats = points.map((pt, i) => {
      const role = i === 0 ? 'start' : (i === points.length - 1 ? 'end' : 'via');
      return wpFeat(pt, role);
    }).filter(Boolean);
    map.getSource('waypoints').setData(fcGJ(feats));
  }
}

function mapClearRoute() {
  _routeCoords = []; _wpStart = null; _wpEnd = null; _tourActive = false;
  mapClearGuideToStart();
  if (map) {
    if (map.getSource('route'))     map.getSource('route').setData(lineGJ([]));
    if (map.getSource('waypoints')) map.getSource('waypoints').setData(fcGJ([]));
    if (map.getSource('traffic'))   map.getSource('traffic').setData(fcGJ([]));
    map.easeTo({ bearing: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 }, pitch: 0, duration: 600 });
  }
}

function mapSetGuideToStart(coords) {
  _guideCoords = coords;
  if (map && map.getSource('guide'))
    map.getSource('guide').setData(lineGJ(coords));
}

function mapClearGuideToStart() {
  _guideCoords = [];
  if (map && map.getSource('guide'))
    map.getSource('guide').setData(lineGJ([]));
}

function mapGoTo(lat, lon, zoom) {
  if (!initialized) initMap(lat, lon);
  if (!map) return;
  map.flyTo({ center: [lon, lat], zoom: zoom, pitch: 0, duration: 900 });
}

function mapSetRouteVisible(visible) {
  if (!map) return;
  const v = visible ? 'visible' : 'none';
  ['route-case', 'route-line', 'waypoints'].forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v);
  });
}

function mapFitBounds(minLat, minLon, maxLat, maxLon) {
  if (!initialized) return;
  if (!map) return;
  map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 48, pitch: 0, duration: 900 });
}

function mapSetStyle(key) {
  if (!map) return;
  const style = STYLES[key] || STYLES.street;
  map.setStyle(style);
}

function _trafficNearRoute() {
  // No route loaded → show everything so the toggle isn't a silent no-op.
  let filtered = _trafficItems;
  if (_routeCoords.length > 0) {
    let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
    for (const [lon, lat] of _routeCoords) {
      if (lat < minLat) minLat = lat;
      if (lat > maxLat) maxLat = lat;
      if (lon < minLon) minLon = lon;
      if (lon > maxLon) maxLon = lon;
    }
    const pad = 0.05; // ~5 km bounding-box padding
    filtered = _trafficItems.filter(
      i => i.lat >= minLat - pad && i.lat <= maxLat + pad &&
           i.lon >= minLon - pad && i.lon <= maxLon + pad
    );
  }
  return filtered
    .map(i => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [i.lon, i.lat] },
      properties: {
        kind: i.kind,
        title: i.title || '',
        subtitle: i.subtitle || '',
        road: i.road || '',
        start: i.start || '',
        blocked: !!i.blocked,
        delay: i.delay || '',
        // MapLibre property values are flat — encode arrays as JSON.
        description: JSON.stringify(i.description || []),
      },
    }));
}

const TRAFFIC_LABELS = {
  blocked: { de: 'Strecke gesperrt', en: 'Road blocked' },
  delay:   { de: 'Verzögerung: ca. {n} Min.', en: 'Delay: approx. {n} min' },
  since:   { de: 'Seit {t}', en: 'Since {t}' },
};
let _trafficLang = 'de';

function _trafficLabel(key, fields) {
  const dict = TRAFFIC_LABELS[key] || {};
  let s = dict[_trafficLang] || dict.en || '';
  if (fields) for (const k in fields) s = s.replace('{' + k + '}', fields[k]);
  return s;
}

function mapSetTrafficLanguage(lang) {
  _trafficLang = (lang === 'en') ? 'en' : 'de';
}

function _escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function _formatTrafficStart(raw) {
  if (!raw) return '';
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function _buildTrafficPopupHTML(props) {
  const road = _escapeHtml(props.road || '');
  const title = _escapeHtml(props.title || '');
  const subtitle = _escapeHtml(props.subtitle || '');
  let descList = [];
  try { descList = JSON.parse(props.description || '[]'); } catch (_) {}
  const header = road && title ? `${road} — ${title}` : (road || title);
  let html = '';
  if (header) html += `<h3>${_escapeHtml(header)}</h3>`;
  if (subtitle) html += `<div class="sub">${subtitle}</div>`;
  if (props.blocked === true || props.blocked === 'true') {
    html += `<div class="blocked">${_escapeHtml(_trafficLabel('blocked'))}</div>`;
  }
  if (props.delay && props.delay !== '0') {
    html += `<div class="delay">${_escapeHtml(_trafficLabel('delay', {n: props.delay}))}</div>`;
  }
  const startStr = _formatTrafficStart(props.start);
  if (startStr) {
    html += `<div class="since">${_escapeHtml(_trafficLabel('since', {t: startStr}))}</div>`;
  }
  if (descList.length) {
    // Cap to 18 lines (autobahn detour lists can run 50+ lines).
    let lines = descList;
    let truncated = false;
    if (lines.length > 18) { lines = lines.slice(0, 18); truncated = true; }
    let text = lines.join('\n');
    if (truncated) text += '\n…';
    html += `<div class="desc">${_escapeHtml(text)}</div>`;
  }
  return html || `<div>${_escapeHtml(title || props.kind || '')}</div>`;
}

function _attachTrafficClick(layerId) {
  map.on('click', layerId, (e) => {
    const f = e.features && e.features[0];
    if (!f) return;
    new maplibregl.Popup({
        className: 'dp-traffic-popup',
        maxWidth: '260px',
        closeOnMove: true,
        offset: 14,
      })
      .setLngLat(f.geometry.coordinates.slice())
      .setHTML(_buildTrafficPopupHTML(f.properties || {}))
      .addTo(map);
  });
  map.on('mouseenter', layerId, () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', layerId, () => { map.getCanvas().style.cursor = ''; });
}

function mapSetTraffic(items) {
  _trafficItems = items;
  if (map && map.getSource('traffic'))
    map.getSource('traffic').setData(fcGJ(_trafficNearRoute()));
}

function mapSetTrafficVisible(visible) {
  _trafficVisible = visible;
  if (!map) return;
  ['traffic-rw', 'traffic-inc'].forEach(id => {
    if (map.getLayer(id))
      map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
  });
}

function mapSetPoiVisible(visible) {
  _poiVisible = visible;
  setBasePoiVisibility(visible);
}

function mapResize() {
  if (map) map.resize();
}

window.addEventListener('DOMContentLoaded', () => {
  const mapEl = document.getElementById('map');

  function tryInit() {
    if (!initialized && mapEl.clientWidth > 0 && mapEl.clientHeight > 0) {
      initMap(DEFAULT_CENTER.lat, DEFAULT_CENTER.lon);
    }
  }

  // Observe container size — init as soon as we have real dimensions,
  // then keep resizing on every layout change (tab switch, window resize).
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => {
      if (!initialized) {
        tryInit();
      } else if (map) {
        map.resize();
      }
    }).observe(mapEl);
  }

  // Also try immediately (works when map tab is the default/active tab).
  tryInit();

  // Last-resort fallback: poll for a real size during the first 2 s.
  let _initTries = 0;
  const _initTimer = setInterval(() => {
    if (initialized || ++_initTries > 20) { clearInterval(_initTimer); return; }
    tryInit();
  }, 100);
});
</script>
</body>
